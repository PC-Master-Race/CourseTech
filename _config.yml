title: Tutorial Hub
tagline: Technology explained in plain English
description: >-
  A growing library of plain-English technology lessons, covering AI at work,
  Excel, everyday devices, and digital life. Written by a working instructor
  and open to anyone who wants to learn.
author: Mr. Perez

# --- GitHub Pages project site ---
# Served at https://pc-master-race.github.io/CourseTech/
# To move to a custom domain later: set `url` to your domain, blank out `baseurl`,
# and add a CNAME file (see README).
url: "https://pc-master-race.github.io"
baseurl: "/CourseTech"

# --- Build ---
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: /:collection/:name/

# Topic pages live in their own collection so adding a topic is one content file.
collections:
  topics:
    output: true
    permalink: /topics/:name/
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
  - scope:
      path: ""
      type: news
    values:
      layout: post

sass:
  style: compressed

exclude:
  - README.md
  - DESIGN.md
  - LESSON_STYLE_PROMPT.md
  - backups
  - tutorial-hub-build-prompt.md
  - preview
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - node_modules

# Plugins available on GitHub Pages
plugins:
  - jekyll-seo-tag
