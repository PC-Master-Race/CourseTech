<header class="site-header">
  <div class="container site-header__bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">TH</span>
      <span>Tutorial Hub</span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <ul>
        <li>
          <button type="button" class="nav-link" id="megaToggle"
                  aria-expanded="false" aria-controls="megaPanel" aria-haspopup="true">
            <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>
            Courses
            <svg class="chev" aria-hidden="true"><use href="#icon-chevron"></use></svg>
          </button>
        </li>
        <li><a class="nav-link" href="{{ '/tools/job-search-pipeline/' | relative_url }}">Job Search</a></li>
        <li><a class="nav-link" href="{{ '/news/' | relative_url }}">News</a></li>
        <li><a class="nav-link" href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
    </nav>
  </div>

  <div class="mega" id="megaPanel" data-open="false" role="region" aria-label="All courses" hidden>
    <div class="mega__inner">
      {% for cat in site.data.topics.categories %}
      <div class="mega__col">
        <a class="mega__col-head" href="{{ '/courses/' | append: cat.id | append: '/' | relative_url }}">
          <svg class="cat-icon" aria-hidden="true"><use href="#icon-{{ cat.icon }}"></use></svg>
          <div>
            <h3 id="mega-cat-{{ cat.id }}">{{ cat.label }}</h3>
            <p>{{ cat.blurb }}</p>
          </div>
        </a>
        <ul class="mega__list" aria-labelledby="mega-cat-{{ cat.id }}">
          {% for t in cat.topics %}
          <li>
            {% if t.status == "soon" %}
            <span class="mega__link is-soon">
              <span class="t">{{ t.title }}</span>
              <span class="soon-tag">Coming soon</span>
            </span>
            {% else %}
            <a class="mega__link" href="{{ '/topics/' | append: t.slug | append: '/' | relative_url }}">
              <span class="t">{{ t.title }}</span>
            </a>
            {% endif %}
          </li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
  </div>
</header>
<div class="mega-overlay" id="megaOverlay" data-open="false" hidden></div>
