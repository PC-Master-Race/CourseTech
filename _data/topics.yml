          - title: When AI Has Caused Real Harm
            slug: real-harm-cases
            blurb: Five real, documented cases, and the lesson in each.
            status: live
          - title: Bias and Fairness in AI
            slug: bias-and-fairness
            blurb: Why AI isn't automatically fair, and what to watch for.
